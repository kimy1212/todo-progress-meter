spring.application.name=todo-progress-meter
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/todo_progress_meter?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo
spring.datasource.username=todo_progress_meter
spring.datasource.password=tpm
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email
