<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

	<div th:fragment="editProgressRate">
		<div class="modal-overlay" id="progressRateModalOverlay">
			<div class="modal" id="progressRateModal" role="dialog" aria-modal="true"
				aria-labelledby="progressRateModalTitle">
				<div class="modal-header">
					<h2 class="modal-title" id="progressRateModalTitle">
						<i class="fa-solid fa-chart-pie"></i>
						進捗率を編集
					</h2>
					<button class="modal-close-button" id="progressRateModalCloseButton" aria-label="閉じる">
						<i class="fa-solid fa-xmark"></i>
					</button>
				</div>
				<div class="modal-body">
					<div class="modal-preview">
						<div class="donut-chart" id="modalDonutChart">
							<div class="donut-chart-inner">
								<span class="progress-rate-value" id="modalProgressRateValue">0</span>
								<span class="progress-rate-unit">%</span>
							</div>
						</div>
					</div>
					<div class="modal-inputs">
						<div class="modal-input-group">
							<label class="modal-input-label" for="progressRateCompleted">完了数（分子）</label>
							<input type="number" id="progressRateCompleted" class="modal-input" min="0" placeholder="0">
						</div>
						<span class="modal-fraction-divider">/</span>
						<div class="modal-input-group">
							<label class="modal-input-label" for="progressRateTotal">全体数（分母）</label>
							<input type="number" id="progressRateTotal" class="modal-input" min="0" placeholder="100">
						</div>
					</div>
				</div>
				<div class="modal-footer">
					<button class="modal-button modal-button--cancel" id="progressRateModalCancelButton">キャンセル</button>
					<button class="modal-button modal-button--save" id="progressRateModalSaveButton">
						<i class="fa-solid fa-check"></i>
						保存
					</button>
				</div>
			</div>
		</div>
	</div>

</body>

</html>
