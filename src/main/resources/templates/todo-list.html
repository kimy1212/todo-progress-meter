<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="common/head :: head">
	<th:block th:fragment="extraHead">
		<link th:href="@{/css/todo-list.css}" rel="stylesheet">
		<link th:href="@{/css/common/modal.css}" rel="stylesheet">
		<link th:href="@{/css/edit-progress-rate.css}" rel="stylesheet">
	</th:block>
</head>

<body>

	<th:block th:replace="common/header :: header"></th:block>

	<main id="todoListScreen">
		<div class="todo-tab-list" id="todoTabList">
			<div class="sidebar-header">
				<button class="sidebar-toggle-button" id="sidebarToggleButton">
					<i class="fa-solid fa-angles-left"></i>
				</button>
			</div>
			<div class="todo-tab-scroll-area" id="todoTabScrollArea">
				<div th:each="todoTab : ${todoTabs}" class="todo-tab" th:data-todo-tab-id="${todoTab.todoTabId}">
					<span th:text="${todoTab.todoTabName}" class="text-small-dark todo-tab-label"></span>
					<button class="delete-todo-tab-button">
						<i class="fa-solid fa-trash"></i>
					</button>
				</div>
			</div>
			<button class="button-circle add-todo-tab-button" id="addTodoTabButton">
				<i class="icon fa-solid fa-plus"></i>
			</button>
		</div>
		<div class="sidebar-resizer" id="sidebarResizer"></div>
		<div class="todo-list" id="todoList">
			<button class="button-circle add-todo-button" id="addTodoButton">
				<i class="icon fa-solid fa-plus"></i>
			</button>
		</div>
	</main>

	<!-- templates -->
	<template id="todo">
		<div class="todo">
			<div class="todo-content"></div>
			<button class="todo-actions-trigger">
				<i class="icon fa-solid fa-ellipsis"></i>
			</button>

			<ul class="todo-actions-menu">
				<li>
					<button class="todo-actions-item edit-progress-rate-button">
						<i class="fa-solid fa-pen-to-square"></i>
						<span class="text-small-dark">進捗率を編集する</span>
					</button>
				</li>
				<li>
					<button class="todo-actions-item delete-todo-button">
						<i class="fa-solid fa-trash"></i>
						<span class="text-small-dark">削除する</span>
					</button>
				</li>
			</ul>

			<div class="donut-chart">
				<div class="donut-chart-inner">
					<span class="progress-rate-value"></span>
					<span class="progress-rate-unit">%</span>
				</div>
			</div>

		</div>
	</template>

	<div th:insert="~{edit-progress-rate :: editProgressRate}"></div>

	<!-- scripts -->
	<script type="module" th:src="@{/js/todo-list.js}"></script>

</body>

</html>
