<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	
<head th:replace="common/head :: head"></head>

<th:block th:fragment="extraHead">
	<link th:href="@{/css/todo-list.css}" rel="stylesheet">
</th:block>

<body>

	<th:block th:replace="common/header :: header"></th:block>

	<main>
		<div class="todo-tab-list" id="todoTabList">
			<div th:each="todoTab : ${todoTabs}" class="todo-tab" th:data-todo-tab-id="${todoTab.todoTabId}">
				<span th:text="${todoTab.todoTabName}" class="text-small-dark todo-tab-label"></span>
			</div>
			<button class="button-circle add-todo-tab-button" id="addTodoTabButton">
				<i class="icon fa-solid fa-plus"></i>
			</button>
		</div>
		<div class="todo-list" id="todoList">
			<button class="button-circle add-todo-button" id="addTodoButton">
				<i class="icon fa-solid fa-plus"></i>
			</button>
		</div>
	</main>

	<script type="module" th:src="@{/js/todo-list.js}"></script>

</body>

</html>
